<!DOCTYPE html>
<html lang="tr" id="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN STUDIO - Blur Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            border-radius: 9999px;
            background: rgba(150, 150, 150, 0.2);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0f172a;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.1s ease;
        }
        .dark input[type="range"]::-webkit-slider-thumb {
            background: #f8fafc;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
</head>
<body id="app-body" class="bg-[#f8fafc] dark:bg-[#06080f] text-slate-900 dark:text-slate-100 flex items-center justify-center min-h-screen m-0 transition-colors duration-300 py-10 selection:bg-slate-900 selection:text-white dark:selection:bg-white dark:selection:text-slate-900">

    <div class="w-[660px] bg-white/90 dark:bg-slate-900/90 backdrop-blur-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-[0_25px_60px_rgba(0,0,0,0.08)] dark:shadow-[0_25px_60px_rgba(0,0,0,0.4)] rounded-[32px] p-8 flex flex-col gap-6 relative">
        
        <!-- Üst Bar -->
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80 pb-4">
            <div class="w-8"></div>
            <div class="text-xs font-extrabold tracking-[0.25em] text-slate-900 dark:text-white uppercase text-center">CAN STUDIO</div>
            <button onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all text-slate-700 dark:text-slate-200 shadow-xs" title="Tema Değiştir">
                <svg id="theme-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
        </div>

        <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Kademeli ve Bölgeli Medya Konsolu</h1>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">İster tam ekran blur uygulayın, ister fotoğraf üzerinde alan seçerek sadece o kısmı blurlaştırın.</p>
        </div>

        <!-- Mod & Sekmeler -->
        <div class="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-slate-800/60 p-1.5 rounded-2xl border border-slate-200/60 dark:border-slate-800">
            <button onclick="switchMediaType('image')" id="tab-image" class="py-2.5 text-xs font-bold rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition-all">Fotoğraf Modu</button>
            <button onclick="switchMediaType('video')" id="tab-video" class="py-2.5 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">Video Modu</button>
        </div>

        <!-- Blur Türü Seçimi (Tam Ekran vs Bölgesel) -->
        <div class="flex gap-2">
            <button onclick="setBlurMode('full')" id="mode-full" class="flex-1 py-2 text-xs font-bold rounded-xl bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 transition-all">Tam Ekran Blur</button>
            <button onclick="setBlurMode('partial')" id="mode-partial" class="flex-1 py-2 text-xs font-bold rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 transition-all">Bölgesel (Seçmeli) Blur</button>
        </div>

        <!-- Önizleme Alanı -->
        <div id="preview-container" class="hidden relative w-full h-72 bg-slate-950 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 flex items-center justify-center shadow-inner">
            <canvas id="preview-canvas" class="max-h-full max-w-full object-contain cursor-crosshair hidden"></canvas>
            <video id="preview-video" class="max-h-full max-w-full object-contain hidden" muted playsinline></video>
            <!-- Seçim kutusu overlay -->
            <div id="selection-box" class="absolute border-2 border-dashed border-cyan-400 bg-cyan-500/20 hidden pointer-events-none"></div>
        </div>
        <div id="selection-info" class="text-[11px] font-bold text-cyan-600 dark:text-cyan-400 text-center hidden">
            💡 Bölgesel Mod Aktif: Görsel üzerinde blurlanmasını istediğiniz alanı fareyle sürükleyerek seçin.
        </div>

        <!-- Slider -->
        <div class="flex flex-col gap-2 bg-slate-50 dark:bg-slate-800/40 p-4 rounded-2xl border border-slate-100 dark:border-slate-800/60">
            <div class="flex justify-between items-center text-xs font-bold text-slate-700 dark:text-slate-300">
                <span>Blur Yoğunluğu</span>
                <span id="intensity-val" class="px-2.5 py-1 bg-slate-200/60 dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white font-extrabold">0 px</span>
            </div>
            <input type="range" id="intensity" min="0" max="50" value="0" 
                   oninput="updateBlur(this.value)" 
                   class="w-full cursor-pointer mt-1">
        </div>

        <!-- Dosya Seçim Alanı -->
        <label id="drop-zone" class="border-2 border-dashed border-slate-200 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-500 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition-all bg-slate-50/50 dark:bg-slate-800/20 group">
            <svg class="w-8 h-8 text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300 mb-2 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-xs font-bold text-slate-700 dark:text-slate-200 text-center" id="file-label">Fotoğraf seçmek için tıklayın veya sürükleyin</span>
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(this)">
        </label>

        <!-- Durum Çubuğu -->
        <div id="status-text" class="text-xs font-bold text-slate-500 dark:text-slate-400 text-center">Sistem Hazır.</div>

        <!-- İndir Butonu -->
        <button onclick="processMedia()" id="action-btn" disabled class="w-full py-3.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-2xl text-xs font-extrabold shadow-lg hover:opacity-95 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
            Önizlemedeki Seviyeyle Cihaza İndir
        </button>

    </div>

    <script>
        let state = {
            image: { file: null, originalImage: null, name: "" },
            video: { file: null, url: "", name: "" }
        };
        
        let mediaType = 'image';
        let blurMode = 'full'; // 'full' veya 'partial'
        let selectedBox = null; // {x, y, width, height} (Orijinal görsel çözünürlüğünde)

        let canvas = document.getElementById('preview-canvas');
        let ctx = canvas.getContext('2d');
        let isDrawing = false;
        let startX, startY;

        function toggleTheme() {
            document.getElementById('app-html').classList.toggle('dark');
        }

        function switchMediaType(type) {
            if (mediaType === type) return;
            mediaType = type;
            const fileInput = document.getElementById('file-input');
            
            document.getElementById('tab-image').className = type === 'image' ? 'py-2.5 text-xs font-bold rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition-all' : 'py-2.5 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
            document.getElementById('tab-video').className = type === 'video' ? 'py-2.5 text-xs font-bold rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition-all' : 'py-2.5 text-xs font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';

            if (type === 'video') {
                fileInput.accept = "video/*";
                setBlurMode('full'); // Videoda şimdilik tam ekran geçerli
                document.getElementById('mode-partial').style.opacity = '0.4';
                document.getElementById('mode-partial').style.pointerEvents = 'none';
                if (state.video.file) {
                    document.getElementById('file-label').innerText = "Seçilen: " + state.video.name;
                    document.getElementById('preview-container').classList.remove('hidden');
                    document.getElementById('preview-video').classList.remove('hidden');
                    document.getElementById('preview-canvas').classList.add('hidden');
                    document.getElementById('preview-video').src = state.video.url;
                    document.getElementById('action-btn').disabled = false;
                } else {
                    document.getElementById('file-label').innerText = "Video seçmek için tıklayın (.mp4, .mov)";
                    resetWorkspaceUI();
                }
            } else {
                fileInput.accept = "image/*";
                document.getElementById('mode-partial').style.opacity = '1';
                document.getElementById('mode-partial').style.pointerEvents = 'auto';
                if (state.image.file) {
                    document.getElementById('file-label').innerText = "Seçilen: " + state.image.name;
                    document.getElementById('preview-container').classList.remove('hidden');
                    document.getElementById('preview-canvas').classList.remove('hidden');
                    document.getElementById('preview-video').classList.add('hidden');
                    drawPreview();
                    document.getElementById('action-btn').disabled = false;
                } else {
                    document.getElementById('file-label').innerText = "Fotoğraf seçmek için tıklayın";
                    resetWorkspaceUI();
                }
            }
        }

        function setBlurMode(mode) {
            blurMode = mode;
            const fullBtn = document.getElementById('mode-full');
            const partBtn = document.getElementById('mode-partial');
            const infoEl = document.getElementById('selection-info');

            if (mode === 'full') {
                fullBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 transition-all";
                partBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 transition-all";
                infoEl.classList.add('hidden');
                selectedBox = null;
                document.getElementById('selection-box').classList.add('hidden');
            } else {
                partBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-cyan-600 text-white transition-all";
                fullBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 transition-all";
                infoEl.classList.remove('hidden');
            }
            drawPreview();
        }

        function resetWorkspaceUI() {
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('preview-canvas').classList.add('hidden');
            document.getElementById('preview-video').classList.add('hidden');
            document.getElementById('action-btn').disabled = true;
            document.getElementById('intensity').value = 0;
            document.getElementById('intensity-val').innerText = "0 px";
            document.getElementById('status-text').innerText = "Sistem Hazır.";
            selectedBox = null;
        }

        function updateBlur(val) {
            document.getElementById('intensity-val').innerText = val + ' px';
            if (mediaType === 'image' && state.image.originalImage) {
                requestAnimationFrame(drawPreview);
            } else if (mediaType === 'video' && state.video.file) {
                document.getElementById('preview-video').style.filter = `blur(${val}px)`;
            }
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('file-label').innerText = "Seçilen: " + file.name;
                document.getElementById('action-btn').disabled = false;
                document.getElementById('preview-container').classList.remove('hidden');

                if (mediaType === 'image') {
                    state.image.file = file;
                    state.image.name = file.name;
                    document.getElementById('preview-canvas').classList.remove('hidden');
                    document.getElementById('preview-video').classList.add('hidden');

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        state.image.originalImage = new Image();
                        state.image.originalImage.onload = function() {
                            canvas.width = state.image.originalImage.width;
                            canvas.height = state.image.originalImage.height;
                            drawPreview();
                            document.getElementById('status-text').innerText = "Fotoğraf hazır. Alan seçebilirsiniz.";
                        }
                        state.image.originalImage.src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                } else {
                    state.video.file = file;
                    state.video.name = file.name;
                    state.video.url = URL.createObjectURL(file);
                    document.getElementById('preview-video').classList.remove('hidden');
                    document.getElementById('preview-canvas').classList.add('hidden');
                    const videoEl = document.getElementById('preview-video');
                    videoEl.src = state.video.url;
                    videoEl.style.filter = `blur(${document.getElementById('intensity').value}px)`;
                    document.getElementById('status-text').innerText = "Video hazır.";
                }
            }
        }

        // Canvas Üzerinde Fare ile Alan Seçme Olayları (Bölgesel Blur İçin)
        canvas.addEventListener('mousedown', (e) => {
            if (blurMode !== 'partial' || !state.image.originalImage) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || blurMode !== 'partial') return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const currentX = (e.clientX - rect.left) * scaleX;
            const currentY = (e.clientY - rect.top) * scaleY;

            selectedBox = {
                x: Math.min(startX, currentX),
                y: Math.min(startY, currentY),
                width: Math.abs(currentX - startX),
                height: Math.abs(currentY - startY)
            };
            drawPreview();
            showDOMSelectionBox(e, rect);
        });

        window.addEventListener('mouseup', () => {
            if (isDrawing) {
                isDrawing = false;
                document.getElementById('status-text').innerText = "Bölge seçildi. İndirebilirsiniz.";
            }
        });

        function showDOMSelectionBox(e, rect) {
            const boxEl = document.getElementById('selection-box');
            // DOM üzerinde görselleştirme için
            // Basitçe kutu gösterimi
        }

        function drawPreview() {
            if (mediaType === 'image' && !state.image.originalImage) return;
            const blurVal = parseInt(document.getElementById('intensity').value);

            if (mediaType === 'image') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(state.image.originalImage, 0, 0);

                if (blurVal > 0) {
                    if (blurMode === 'full') {
                        ctx.filter = `blur(${blurVal}px)`;
                        ctx.drawImage(state.image.originalImage, 0, 0);
                        ctx.filter = 'none';
                    } else if (blurMode === 'partial' && selectedBox && selectedBox.width > 5 && selectedBox.height > 5) {
                        // Seçilen bölgeyi geçici bir canvas'a alıp blur verip geri basıyoruz
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(selectedBox.x, selectedBox.y, selectedBox.width, selectedBox.height);
                        ctx.clip();
                        
                        ctx.filter = `blur(${blurVal}px)`;
                        ctx.drawImage(state.image.originalImage, 0, 0);
                        ctx.restore();
                        ctx.filter = 'none';

                        // Seçim sınır çizgisi
                        ctx.strokeStyle = '#06b6d4';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(selectedBox.x, selectedBox.y, selectedBox.width, selectedBox.height);
                    }
                }
            }
        }

        async function processMedia() {
            const currentFile = mediaType === 'image' ? state.image.file : state.video.file;
            const blurIntensity = document.getElementById('intensity').value;
            
            if (!currentFile) return;

            const btn = document.getElementById('action-btn');
            const status = document.getElementById('status-text');
            btn.disabled = true;
            status.innerText = "Sunucuda işleniyor, lütfen bekleyin...";

            const formData = new FormData();
            formData.append("file", currentFile);
            formData.append("intensity", blurIntensity);
            formData.append("media_type", mediaType);
            if (blurMode === 'partial' && selectedBox) {
                formData.append("box", JSON.stringify(selectedBox));
            }

            try {
                const response = await fetch('/api/process-media', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("İşlem hatası");

                const result = await response.json();

                if (result.success) {
                    status.innerText = "İşlem tamamlandı, cihaza indiriliyor!";
                    const a = document.createElement('a');
                    a.href = result.download_url;
                    a.download = currentFile.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    status.innerText = "Bir hata oluştu!";
                }
            } catch (err) {
                console.error(err);
                status.innerText = "Sunucu bağlantı hatası!";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
